[package]
name = "workbuddy-account-hub"
version = "0.5.22"
edition = "2021"
description = "WorkBuddy 账户中枢：秒切多账号且对话历史 100% 保留（本地 Tauri 2 + Rust）"
authors = ["you"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
account_ops = { path = "crates/account_ops" }
wb_api = { path = "crates/wb_api" }

[profile.release]
panic = "abort"
strip = true
opt-level = "s"

# account_ops: 纯文件/进程逻辑（无网络）；wb_api: 官方接口网络层
[workspace]
members = ["crates/account_ops", "crates/wb_api"]
