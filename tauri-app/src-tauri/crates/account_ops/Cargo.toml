[package]
name = "account_ops"
version = "0.1.0"
edition = "2021"
description = "WorkBuddy 账户中枢 — 纯文件/进程操作逻辑（无网络、无 tauri 依赖）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# 渲染层会话置顶状态存在 Electron localStorage（leveldb），切换账号时需把
# `wb:conversation-list:*:u:<旧uid>` 键复制为 `u:<新uid>`。用 leveldb crate 读写该库。
# default-features=false 关掉 snappy，避免额外原生依赖。
leveldb = { version = "0.8", default-features = false }
# db-key 0.0.5 的 Key trait 只为 i32 实现，需自行为新类型实现 Key；
# 显式 pin 同一版本，确保与 leveldb 内部使用的 db-key 是同一个 trait。
db-key = "0.0.5"
