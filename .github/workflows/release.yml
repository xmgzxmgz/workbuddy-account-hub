name: Release Win / Mac

# 触发：推送 v* tag 时构建并发布；也可通过 workflow_dispatch 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- mac·os ----------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach macOS installers to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: true
          prerelease: false

  # ---------- windows ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach Windows installers to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: true
          prerelease: false
