name: Release Win / Mac

# 触发：推送 v* tag 时构建并发布；也可通过 workflow_dispatch 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 发布构建同时占用 macOS(10x)/Windows(2x) 额度，取消同 tag 的旧运行避免重复烧
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- mac·os ----------
  build-macos:
    # 本机 self-hosted runner，不消耗 Actions 额度（hosted macOS 按 10x 计费）
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach macOS installers to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          args: "--bundles dmg,app"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: false
          prerelease: false

  # ---------- windows ----------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach Windows installer to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          args: "--bundles nsis"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: false
          prerelease: false

      - name: Package Windows portable (green) zip
        shell: pwsh
        run: |
          $rel = "tauri-app/src-tauri/target/release"
          $ver = "${{ github.ref_name }}"
          $zip = "WorkBuddy-Account-Hub_${ver}_portable-x64.zip"
          # 真实二进制名由 Cargo package.name 决定（workbuddy-account-hub），不是 tauri.conf.json 的 productName
          $exe = Get-Item "$rel/workbuddy-account-hub.exe" -ErrorAction Stop
          $items = @($exe)
          $dlls = Get-ChildItem "$rel" -Filter *.dll -ErrorAction SilentlyContinue
          if ($dlls) { $items += $dlls }
          Compress-Archive -Path $items -DestinationPath $zip -Force
          echo "created $zip ($(($items).Count) file(s))"

      - name: Upload portable zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "WorkBuddy-Account-Hub_${{ github.ref_name }}_portable-x64.zip"
          draft: false
