name: Release Win / Mac

# 触发：推送 v* tag 时构建并发布；也可通过 workflow_dispatch 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 发布构建同时占用 macOS(10x)/Windows(2x) 额度，取消同 tag 的旧运行避免重复烧
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- mac·os ----------
  build-macos:
    # public 仓库的 Actions 免费、不占额度，用官方 hosted 镜像更省心；
    # 且 public 仓库绝不能挂 self-hosted runner（陌生 PR 会在本机执行代码）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach macOS installers to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          args: "--bundles dmg,app"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: false
          prerelease: false

  # ---------- windows ----------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach Windows installer to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          args: "--bundles nsis"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: false
          prerelease: false

      - name: Package Windows portable (green) zip
        shell: pwsh
        run: |
          $rel = "tauri-app/src-tauri/target/release"
          $ver = "${{ github.ref_name }}"
          $zip = "WorkBuddy-Account-Hub_${ver}_portable-x64.zip"
          # 真实二进制名由 Cargo package.name 决定（workbuddy-account-hub），不是 tauri.conf.json 的 productName
          $exe = Get-Item "$rel/workbuddy-account-hub.exe" -ErrorAction Stop
          $items = @($exe)
          $dlls = Get-ChildItem "$rel" -Filter *.dll -ErrorAction SilentlyContinue
          if ($dlls) { $items += $dlls }
          Compress-Archive -Path $items -DestinationPath $zip -Force
          echo "created $zip ($(($items).Count) file(s))"

      - name: Upload portable zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "WorkBuddy-Account-Hub_${{ github.ref_name }}_portable-x64.zip"
          draft: false

  # ---------- 收口 ----------
  # 为什么单独一个 job 而不在两个 build job 里各自填 releaseBody：
  # tauri-action 在创建/更新 release 时会带上 releaseBody（默认空串），
  # 两个平台都会去调 updateRelease，谁后跑谁说了算 —— 结果就是正文被空串覆盖，
  # 这正是此前 30+ 个版本正文全空的成因。所以正文只在一个地方写，且写在最后。
  finalize-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 即使某个平台的构建失败，也要把正文写上并提示，别留下空 release
    if: always() && needs.build-macos.result != 'cancelled' && needs.build-windows.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          OUT=".release-notes.md"
          if python3 scripts/changelog_notes.py --tag "${GITHUB_REF_NAME}" --out "$OUT"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "**${GITHUB_REF_NAME}**"
              echo
              echo "> 本次发布未在 CHANGELOG.md 找到对应条目。"
              echo "> 维护者请补写 CHANGELOG 后手动编辑本 Release 正文。"
              echo
              echo "### 下载"
              echo "- Windows：\`..._x64-setup.exe\`（安装版）/ \`..._portable-x64.zip\`（免安装）"
              echo "- macOS：\`..._aarch64.dmg\`"
            } > "$OUT"
          fi
          echo "----- 生成的正文 -----"
          cat "$OUT"

      - name: Apply release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 两个平台都构建失败时 release 根本不存在，此时 gh release edit 会硬失败，
          # 把一个"构建失败"变成两个失败，反而看不清主因。这里降级为一条 warning。
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::warning title=Release 不存在::${GITHUB_REF_NAME} 没有创建 release（构建可能全部失败），跳过正文写入。"
            exit 0
          fi
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file .release-notes.md

      - name: Warn if CHANGELOG entry missing
        if: steps.notes.outputs.ok == 'false'
        run: |
          echo "::warning title=CHANGELOG 缺条目::${GITHUB_REF_NAME} 没有在 CHANGELOG.md 中写条目，已用兜底正文。"
