name: Release Win / Mac

# 触发：推送 v* tag 时构建并发布；也可通过 workflow_dispatch 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- mac·os ----------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach macOS installers to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          args: "--bundles dmg,app"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: true
          prerelease: false

  # ---------- windows ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./tauri-app/src-tauri

      - name: Install tauri CLI deps
        run: cd tauri-app && npm install

      - name: Build & attach Windows installer to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          args: "--bundles nsis"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy Account Hub v__VERSION__"
          releaseDraft: true
          prerelease: false

      - name: Package Windows portable (green) zip
        shell: pwsh
        run: |
          $rel = "tauri-app/src-tauri/target/release"
          $ver = "${{ github.ref_name }}"
          $zip = "WorkBuddy-Account-Hub_${ver}_portable-x64.zip"
          $items = @()
          $items += Get-Item "$rel/WorkBuddy Account Hub.exe"
          $items += Get-ChildItem "$rel" -Filter *.dll
          Compress-Archive -Path $items -DestinationPath $zip -Force
          echo "created $zip"

      - name: Upload portable zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "WorkBuddy-Account-Hub_${{ github.ref_name }}_portable-x64.zip"
          draft: true
